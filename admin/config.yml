backend:
  name: github
  repo: laurence-cmd/mon-site-assistant
  branch: main
  base_url: https://decap-oauth-provider.vercel.app
  auth_endpoint: /auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Accueil"
        name: "index"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
